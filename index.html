
<style>
*{box-sizing:border-box;margin:0;padding:0}
.ring-wrap{position:relative;width:560px;height:560px;margin:0 auto}
.seg{position:absolute;cursor:pointer;transition:transform 0.22s cubic-bezier(.34,1.56,.64,1)}
.seg svg{display:block;overflow:visible}
.seg path{transition:filter 0.2s}
.tooltip{
  position:fixed;pointer-events:none;z-index:9999;
  background:var(--color-background-primary);
  border:0.5px solid var(--color-border-secondary);
  border-radius:var(--border-radius-lg);
  padding:12px 16px;
  max-width:220px;
  opacity:0;
  transition:opacity 0.15s;
  box-shadow:none;
}
.tooltip.show{opacity:1}
.tooltip h3{font-size:14px;font-weight:500;color:var(--color-text-primary);margin-bottom:6px}
.tooltip p{font-size:12px;color:var(--color-text-secondary);line-height:1.5}
.center-label{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  text-align:center;pointer-events:none;
}
.center-label span{font-size:13px;color:var(--color-text-secondary)}
</style>

<h2 class="sr-only">Ewb iLab Project Wheel</h2>
<div style="padding:2rem 0">
  <div class="ring-wrap" id="ring"></div>
  <div class="tooltip" id="tip">
    <h3 id="tip-title"></h3>
    <p id="tip-desc"></p>
  </div>
</div>

<script>
const CX=280,CY=280,R_IN=90,R_OUT=240;
const N=10;
const GAP_DEG=1.2;
const COLORS=[
  ['#C8C4F8','#7F77DD','#3C3489'],
  ['#9FE1CB','#1D9E75','#085041'],
  ['#F5C4B3','#D85A30','#712B13'],
  ['#F4C0D1','#D4537E','#72243E'],
  ['#B5D4F4','#378ADD','#0C447C'],
  ['#C0DD97','#639922','#3B6D11'],
  ['#FAC775','#BA7517','#633806'],
  ['#F7C1C1','#E24B4A','#791F1F'],
  ['#D3D1C7','#888780','#444441'],
  ['#9FE1CB','#0F6E56','#04342C'],
];
const SEGMENTS=Array.from({length:N},(_,i)=>({
  id:i+1,
  label:`ilab ${i+1}`,
  href:`#section-${i+1}`,
  desc:`Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.`
}));

function toRad(d){return d*Math.PI/180}
function pt(cx,cy,r,deg){return[cx+r*Math.cos(toRad(deg)),cy+r*Math.sin(toRad(deg))]}

function wedgePath(a1,a2,rIn,rOut){
  const[x1,y1]=pt(CX,CY,rIn,a1);
  const[x2,y2]=pt(CX,CY,rOut,a1);
  const[x3,y3]=pt(CX,CY,rOut,a2);
  const[x4,y4]=pt(CX,CY,rIn,a2);
  const lg=a2-a1>180?1:0;
  return`M${x1},${y1} L${x2},${y2} A${rOut},${rOut} 0 ${lg},1 ${x3},${y3} L${x4},${y4} A${rIn},${rIn} 0 ${lg},0 ${x1},${y1} Z`;
}

function sampleArc(r,a1,a2,n=40){
  const pts=[];
  for(let i=0;i<=n;i++){
    const a=a1+(a2-a1)*i/n;
    pts.push(pt(CX,CY,r,a));
  }
  return pts;
}

function bbox(pts){
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  for(const[x,y]of pts){
    if(x<minX)minX=x;if(y<minY)minY=y;
    if(x>maxX)maxX=x;if(y>maxY)maxY=y;
  }
  return{minX,minY,maxX,maxY};
}

const PAD=4;
const ring=document.getElementById('ring');
const tip=document.getElementById('tip');
const tipTitle=document.getElementById('tip-title');
const tipDesc=document.getElementById('tip-desc');

const sliceDeg=(360-N*GAP_DEG)/N;
const startOffset=-90;

SEGMENTS.forEach((seg,i)=>{
  const a1=startOffset+i*(sliceDeg+GAP_DEG)+GAP_DEG/2;
  const a2=a1+sliceDeg;
  const path=wedgePath(a1,a2,R_IN,R_OUT);

  // bounding box from sampled arc points
  const outerPts=sampleArc(R_OUT,a1,a2,80);
  const innerPts=sampleArc(R_IN,a1,a2,80);
  const{minX,minY,maxX,maxY}=bbox([...outerPts,...innerPts]);
  const W=maxX-minX+PAD*2;
  const H=maxY-minY+PAD*2;
  const ox=minX-PAD;
  const oy=minY-PAD;

  // transform origin as % relative to this box
  const toX=((CX-ox)/W*100).toFixed(2);
  const toY=((CY-oy)/H*100).toFixed(2);

  // midpoint angle for label + icon
  const aMid=(a1+a2)/2;
  const rMid=(R_IN+R_OUT)/2;
  const[lx,ly]=pt(CX,CY,rMid,aMid);

  const[cl,cm,cd]=COLORS[i%COLORS.length];

  // clip id
  const clipId=`clip${i}`;

  const div=document.createElement('div');
  div.className='seg';
  div.style.cssText=`left:${ox}px;top:${oy}px;width:${W}px;height:${H}px;transform-origin:${toX}% ${toY}%`;

  div.innerHTML=`<svg width="${W}" height="${H}" viewBox="${ox} ${oy} ${W} ${H}" overflow="visible">
    <defs>
      <clipPath id="${clipId}"><path d="${path}"/></clipPath>
    </defs>
    <path d="${path}" fill="${cl}" stroke="${cm}" stroke-width="1.2"/>
    <g clip-path="url(#${clipId})">
      <text x="${lx}" y="${ly+4}" text-anchor="middle" dominant-baseline="central"
        font-family="var(--font-sans,sans-serif)" font-size="12" font-weight="500" fill="${cd}">${seg.label}</text>
    </g>
  </svg>`;

  div.addEventListener('mouseenter',e=>{
    div.style.transform='scale(1.13)';
    tipTitle.textContent=seg.label;
    tipDesc.textContent=seg.desc;
    tip.classList.add('show');
  });
  div.addEventListener('mousemove',e=>{
    let tx=e.clientX+16,ty=e.clientY-20;
    if(tx+230>window.innerWidth)tx=e.clientX-240;
    tip.style.left=tx+'px';
    tip.style.top=ty+'px';
  });
  div.addEventListener('mouseleave',()=>{
    div.style.transform='scale(1)';
    tip.classList.remove('show');
  });
  div.addEventListener('click',()=>{
    window.location.href=seg.href;
  });

  ring.appendChild(div);
});

// center decoration
const cl=document.createElement('div');
cl.className='center-label';
cl.innerHTML='<span>Select a section</span>';
ring.appendChild(cl);
</script>
